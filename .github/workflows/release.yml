name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_NAME: 2.0.${{ github.run_number }}
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  WP_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  WP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  WP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 --decode > keystore/wp-ci.jks

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PWP_VERSION_CODE="${{ github.run_number }}" \
            -PWP_VERSION_NAME="$VERSION_NAME"

      - name: Verify package
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME"/build-tools/35.0.0/aapt dump badging "$APK" | head -1
          # The rebuilt app must stay offline.
          if "$ANDROID_HOME"/build-tools/35.0.0/aapt dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "The release APK requests INTERNET; refusing to publish." >&2
            exit 1
          fi
          cp "$APK" "world-provinces-reborn-$VERSION_NAME.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: world-provinces-reborn-${{ env.VERSION_NAME }}
          path: world-provinces-reborn-${{ env.VERSION_NAME }}.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: World Provinces Reborn ${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: world-provinces-reborn-${{ env.VERSION_NAME }}.apk
          fail_on_unmatched_files: true
